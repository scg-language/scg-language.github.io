<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SCG アプリ</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; background: #F6F3F8; color: #2B2233; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.lead { margin: 0 0 24px; color: #6B6075; font-size: .92rem; }
  a.app { display: block; padding: 18px 20px; margin: 0 0 12px; background: #fff; border: 1px solid #D6CFDD; border-radius: 14px; text-decoration: none; color: inherit; }
  a.app:hover, a.app:focus { border-color: #6B3FA0; outline: none; }
  a.app b { display: block; font-size: 1.08rem; }
  a.app span { display: block; margin-top: 4px; color: #6B6075; font-size: .88rem; }
</style>
</head>
<body>
<main>
  <h1>SCG アプリ</h1>
  <p class="lead">Apps for SCG students</p>
  <a class="app" href="/scg-student-portal/">
    <b>【学生ポータル】 Student Portal</b>
    <span>しょうテスト・アンケート ／ Quizzes and surveys</span>
  </a>
</main>
</body>
</html>
